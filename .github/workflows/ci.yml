name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Inventory & Shannon Complexity Tests
        run: npm run test:inventory && npm run test:shannon

      - name: Run Accessibility & Density Verification
        run: npm run test:a11y && npm run test:density

      - name: Run HTML Conformance & Performance Budget Tests
        run: npm run test:html && npm run test:perf

      - name: Run Security Headers & Fitts Law Ergonomics Tests
        run: npm run test:security && npm run test:fitts
